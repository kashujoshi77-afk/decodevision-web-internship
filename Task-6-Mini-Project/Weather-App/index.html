<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weather App | Kashish Joshi</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="weather-app">


        <!-- HEADER -->

        <header class="weather-header">

            <p class="eyebrow">
                WEATHER CHECK
            </p>

            <h1>
                Weather App
            </h1>

            <p>
                Search for the current weather
                of any city.
            </p>

        </header>



        <!-- SEARCH -->

        <section class="search-section">

            <form id="weatherForm">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Search
                </button>

            </form>

        </section>



        <!-- ERROR MESSAGE -->

        <p
            id="errorMessage"
            class="error-message"
        ></p>


        <p
    id="loadingMessage"
    class="loading-message"
>
    Fetching weather data...
</p>



        <!-- WEATHER CARD -->

        <section
            id="weatherCard"
            class="weather-card"
        >
        

            <div class="weather-main">
                

    <div class="location-info">

        <p id="cityName" class="city-name">
            City Name
        </p>

        <p id="currentDate" class="current-date">
            Date
        </p>

        <p id="weatherDescription" class="weather-description">
            Weather condition
        </p>

    </div>
    


    <div class="weather-temperature">

        <img
            id="weatherIcon"
            src=""
            alt="Weather Icon"
        >

        <span id="temperature">
            --°C
        </span>

    </div>

</div>


               

            </div>



            <!-- WEATHER DETAILS -->

            <div class="weather-details">


                <div class="weather-detail">

                    <span>
                        💧
                    </span>

                    <div>

                        <small>
                            Humidity
                        </small>

                        <strong id="humidity">
                            --%
                        </strong>

                    </div>

                </div>



                <div class="weather-detail">

                    <span>
                        💨
                    </span>

                    <div>

                        <small>
                            Wind Speed
                        </small>

                        <strong id="windSpeed">
                            -- km/h
                        </strong>

                    </div>

                </div>



                <div class="weather-detail">

                    <span>
                        🌡️
                    </span>

                    <div>

                        <small>
                            Feels Like
                        </small>

                        <strong id="feelsLike">
                            --°C
                        </strong>

                    </div>

                </div>


            </div>

        </section>



        <!-- DEFAULT MESSAGE -->

        <p
            id="defaultMessage"
            class="default-message"
        >
            Enter a city name to see the weather.
        </p>


    </main>



    <script src="script.js"></script>

</body>

</html>
